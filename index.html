function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(a,k){ return shuffle(a).slice(0,k); }

/* --- Tartib masalasi: kim baland / tez / og'ir / katta --- */
const ORD = [
 {rel:(a,b)=>`${a} ${b}dan baland bo'yli.`,    top:"Eng baland bo'yli kim?",       bot:"Eng past bo'yli kim?"},
 {rel:(a,b)=>`${a} ${b}dan tezroq yuguradi.`,  top:"Eng tez yuguradigan kim?",      bot:"Eng sekin yuguradigan kim?"},
 {rel:(a,b)=>`${a} ${b}dan og'irroq.`,         top:"Eng og'ir kim?",                bot:"Eng yengil kim?"},
 {rel:(a,b)=>`${a} ${b}dan yoshi katta.`,      top:"Yoshi eng katta kim?",          bot:"Yoshi eng kichik kim?"}
];
function genOrder(){
  const n = Math.random()<0.4 ? 4 : 3;
  const people = sample(NAMES,n);                // people[0] eng yuqori, oxirgisi eng quyi
  const o = pick(ORD);
  const clues=[], pairs=[];
  for(let i=0;i<n-1;i++){ clues.push(o.rel(people[i],people[i+1])); pairs.push([people[i],people[i+1]]); }
  const askTop = Math.random()<0.5;
  const ans = askTop ? people[0] : people[n-1];
  const opts = shuffle(people);
  return {t:"mantiq", d:(n===4?3:2), q: shuffle(clues).join(" ")+" "+(askTop?o.top:o.bot),
          o:opts, a:opts.indexOf(ans), _g:"order", _pairs:pairs, _askTop:askTop};
}

/* --- Hafta kunlari --- */
const REFS = [
 {off:-2, txt:y=>`Kechadan oldingi kun ${y} edi.`},
 {off:-1, txt:y=>`Kecha ${y} edi.`},
 {off: 1, txt:y=>`Ertaga ${y} bo'ladi.`},
 {off: 2, txt:y=>`Indinga ${y} bo'ladi.`}
];
const TGTS = [
 {off: 0, txt:"Bugun qaysi kun?"},
 {off: 1, txt:"Ertaga qaysi kun bo'ladi?"},
 {off:-1, txt:"Kecha qaysi kun edi?"},
 {off: 2, txt:"Indinga qaysi kun bo'ladi?"},
 {off:-2, txt:"Kechadan oldingi kun qaysi kun edi?"}
];
function dayOptions(ansIdx){
  const others = shuffle([0,1,2,3,4,5,6].filter(i=>i!==ansIdx)).slice(0,3);
  const opts = shuffle([ansIdx].concat(others)).map(i=>DAYS[i]);
  return opts;
}
function genWeek(){
  if(Math.random()<0.5){
    const day=rnd(7), n=pick([9,10,11,12,16,17,18,20,23,25,30,31]);
    const ans=(day+n)%7, opts=dayOptions(ans);
    return {t:"mantiq", d:3, q:`Bugun ${DAYS[day]}. ${n} kundan keyin qaysi kun bo'ladi?`, o:opts, a:opts.indexOf(DAYS[ans]), _g:"week2", _day:day, _n:n};
  }
  const r=pick(REFS), tt=pick(TGTS.filter(x=>x.off!==r.off));
  const y=rnd(7);
  const ans=(((y - r.off + tt.off)%7)+7)%7, opts=dayOptions(ans);
  const hard = (Math.abs(r.off)===2 || Math.abs(tt.off)===2);
  return {t:"mantiq", d:(hard?3:2), q:`${r.txt(DAYS[y])} ${tt.txt}`, o:opts, a:opts.indexOf(DAYS[ans]), _g:"week1", _y:y, _ref:r.off, _tgt:tt.off};
}

/* --- Kasblarni topish --- */
function genJob(){
  const [p1,p2,p3]=sample(NAMES,3);
  const [j1,j2,j3]=sample(JOBS,3);
  // haqiqat: p1=j2, p2=j1, p3=j3
  const truth={}; truth[p1]=j2; truth[p2]=j1; truth[p3]=j3;
  const who = pick([p1,p2,p3]);
  const text = `${p1}, ${p2} va ${p3}ning kasblari: ${j1.toLowerCase()}, ${j2.toLowerCase()} va ${j3.toLowerCase()} (har biri har xil). `+
               `${p2} ${j2.toLowerCase()} ham, ${j3.toLowerCase()} ham emas. ${p3} ${j2.toLowerCase()} emas. ${who} kim?`;
  const extra = pick(JOBS.filter(j=>j!==j1&&j!==j2&&j!==j3));
  const opts = shuffle([j1,j2,j3,extra]);
  return {t:"mantiq", d:3, q:text, o:opts, a:opts.indexOf(truth[who]), _g:"job", _truth:truth, _who:who, _jobs:[j1,j2,j3]};
}

/* --- Yo'nalish --- */
function genDir(){
  const steps = Math.random()<0.5 ? 2 : 3;
  const start = rnd(4); let cur = start; const parts=[];
  const TURN=[{txt:"o'ngga",d:1},{txt:"chapga",d:3},{txt:"orqaga",d:2}];
  const used=[];
  for(let i=0;i<steps;i++){ const t=pick(TURN); cur=(cur+t.d)%4; parts.push(t.txt); used.push(t.txt); }
  const text = `${DIR_DAT[start]} qarab turibsiz. Avval ${parts[0]}, keyin ${parts.slice(1).join(", keyin ")} burildingiz. Endi qaysi tomonga qaraysiz?`;
  const opts = shuffle(DIRS);
  return {t:"fazo", d:(steps===3?3:2), q:text, o:opts, a:opts.indexOf(DIRS[cur]), _g:"dir", _start:start, _turns:used};
}

/* --- Oynadagi soat --- */
function fmtT(total){ const m=((total%720)+720)%720; let h=Math.floor(m/60); const mm=m%60; if(h===0) h=12; return h+":"+String(mm).padStart(2,"0"); }
function genMirror(){
  let h, mm, shown;
  do { h=1+rnd(11); mm=pick([0,0,15,30,45]); shown=h*60+mm; } while(h===6 && mm===0);
  const real=720-shown;
  const ans=fmtT(real), seen=fmtT(shown);
  if(ans===seen) return genMirror();
  const set=new Set([ans,seen]);
  while(set.size<4) set.add(fmtT(real+30*(rnd(9)-4)));
  const opts=shuffle([...set]);
  return {t:"fazo", d:(mm===0?2:3), q:`Soatning oynadagi aksi ${seen} ni ko'rsatyapti. Soat haqiqatda necha?`, o:opts, a:opts.indexOf(ans), _g:"mirror", _shown:shown};
}

/* --- Soat millari orasidagi burchak --- */
function genAngle(){
  const h=1+rnd(11);
  const ang=Math.min(30*h, 360-30*h);
  const set=new Set([ang]);
  const pool=[30,60,90,120,150,180,210,240];
  while(set.size<4) set.add(pick(pool));
  const opts=shuffle([...set].map(v=>v+"°"));
  return {t:"fazo", d:2, q:`Soat roppa-rosa ${h}:00 bo'lganda, soat va minut millari orasidagi kichik burchak necha gradus?`, o:opts, a:opts.indexOf(ang+"°"), _g:"angle", _h:h};
}

const GENS = { mantiq:[genOrder,genWeek,genJob], fazo:[genDir,genMirror,genAngle] };

/* =====================================================================
   3) TEST TUZISH
   ===================================================================== */
function getSeen(){ try{ return JSON.parse(localStorage.getItem("iqseen")||"[]"); }catch(e){ return []; } }
function saveSeen(a){ try{ localStorage.setItem("iqseen", JSON.stringify(a.slice(-500))); }catch(e){} }

function poolFor(cat){
  const pool = BANK.filter(q=>q.t===cat).slice();
  (GENS[cat]||[]).forEach(g=>{ for(let i=0;i<14;i++) pool.push(g()); });
  const m=new Map(); pool.forEach(q=>{ if(!m.has(q.q)) m.set(q.q,q); });
  return [...m.values()];
}

function buildTest(){
  const seen=new Set(getSeen());
  let chosen=[];
  for(const cat in QUOTA){
    const pool=poolFor(cat);
    pool.forEach(q=>{ q._s = Math.random() + (seen.has(q.q)?-1:0) + (q.d===1?0.05:0) + (q.d===2?0.2:0); });
    pool.sort((a,b)=>b._s-a._s);
    chosen = chosen.concat(pool.slice(0,QUOTA[cat]));
  }
  chosen.forEach(q=>{ q._r=Math.random(); });
  chosen.sort((a,b)=>(a.d-b.d)||(a._r-b._r));
  // Birinchi 3 savolda tarix bo'lmasin
  const head=[], rest=[];
  chosen.forEach(q=>{ if(head.length<3 && q.t!=="tarix") head.push(q); else rest.push(q); });
  const list=head.concat(rest);
  saveSeen([...seen].concat(list.map(q=>q.q)));
  // Variantlarni aralashtirish
  return list.map(q=>{
    const idx=shuffle(q.o.map((_,i)=>i));
    return {t:q.t, d:q.d, q:q.q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)};
  });
}

/* =====================================================================
   4) INTERFEYS
   ===================================================================== */
const app = document.getElementById('app');
let Q=[], idx=0, answers=[], left=TOTAL_SEC, timerId=null;

function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,'0'); }

function start(){
  app.innerHTML = `
  <div class="card center">
    <div style="font-size:54px">🧠</div>
    <h1>IQ TEST AI</h1>
    <p>20 ta savol · ${TOTAL_SEC/60} daqiqa. Savollar har safar yangicha tanlanadi va asta-sekin qiyinlashadi.<br>Mantiq, so'z, fazoviy va hayotiy fikrlash, shuningdek tarix bo'yicha bilimingiz tekshiriladi.</p>
    <p>Shoshilmang, lekin vaqtga e'tibor bering. Bilmagan savolni o'tkazib yuborib, keyin qaytishingiz mumkin.</p>
    <button class="btn" onclick="begin()">Testni boshlash</button>
  </div>`;
}

function begin(){
  Q = buildTest();
  idx=0; answers=new Array(Q.length).fill(null); left=TOTAL_SEC;
  clearInterval(timerId);
  timerId=setInterval(()=>{
    left--;
    const el=document.getElementById('tm'); if(el) el.textContent="⏱ "+fmt(left);
    if(left<=0){ clearInterval(timerId); finish(); }
  },1000);
  show();
}

function show(){
  const q=Q[idx];
  const pct=Math.round((idx/Q.length)*100);
  app.innerHTML = `
  <div class="top"><span>Savol ${idx+1} / ${Q.length}</span><span class="timer" id="tm">⏱ ${fmt(left)}</span></div>
  <div class="bar"><div style="width:${pct}%"></div></div>
  <div class="card">
    <h2>${q.q}</h2>
    ${q.o.map((x,i)=>`<button class="opt ${answers[idx]===i?'sel':''}" onclick="choose(${i})">${x}</button>`).join('')}
    <button class="btn" onclick="next()">${idx===Q.length-1?"Natijani ko'rish":"Keyingisi"}</button>
    ${idx>0?'<button class="btn ghost" onclick="prev()">Orqaga</button>':''}
  </div>`;
}

function choose(i){
  answers[idx]=i;
  document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',k===i));
  if(tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
}
function next(){ if(idx<Q.length-1){ idx++; show(); } else finish(); }
function prev(){ if(idx>0){ idx--; show(); } }

function finish(){
  clearInterval(timerId);
  let c=0;
  const by={tarix:[0,0],mantiq:[0,0],soz:[0,0],fazo:[0,0],hayot:[0,0]};
  Q.forEach((q,i)=>{ by[q.t][1]++; if(answers[i]===q.a){ c++; by[q.t][0]++; } });
  const iq=80+c*3;
  let level,desc;
  if(iq>=130){ level="Juda yuqori"; desc="Murakkab masalalarni tez va chuqur tahlil qila olasiz."; }
  else if(iq>=115){ level="Yuqori"; desc="Mantiqiy fikrlashingiz o'rtachadan yaxshi darajada."; }
  else if(iq>=100){ level="O'rtadan yuqori"; desc="Yaxshi poydevor bor, mashq bilan yanada o'sasiz."; }
  else if(iq>=90){ level="O'rta"; desc="Barqaror natija. Muntazam mashq katta farq beradi."; }
  else { level="Rivojlanish bosqichi"; desc="Bu faqat boshlanish. Mashq qilsangiz natija tez yaxshilanadi."; }
  const names={tarix:"Tarix va bilim",mantiq:"Mantiqiy xulosa",soz:"So'z va ma'no",fazo:"Fazoviy fikrlash",hayot:"Hayotiy fikrlash"};
  const keys=Object.keys(by).filter(k=>by[k][1]>0);
  const rows=keys.map(k=>`<div class="stat"><span>${names[k]}</span><b>${by[k][0]} / ${by[k][1]}</b></div>`).join('');
  const ranked=keys.slice().sort((a,b)=>by[b][0]/by[b][1]-by[a][0]/by[a][1]);
  const best=names[ranked[0]], weak=names[ranked[ranked.length-1]];
  const used=TOTAL_SEC-Math.max(left,0);
  app.innerHTML=`
  <div class="card">
    <p class="center" style="margin:0">Sizning taxminiy IQ ballingiz</p>
    <div class="big">${iq}</div>
    <h2 class="center" style="margin-bottom:6px">${level}</h2>
    <p class="center">${desc}</p>
    <div class="stat"><span>To'g'ri javoblar</span><b>${c} / ${Q.length}</b></div>
    <div class="stat"><span>Sarflangan vaqt</span><b>${fmt(used)}</b></div>
    ${rows}
    <div style="margin-top:14px">
      <div class="tip">💪 <b>Eng kuchli tomoningiz:</b> ${best}</div>
      <div class="tip">🎯 <b>Rivojlantirish kerak:</b> ${weak}. Kuniga 10 daqiqa shu turdagi masalalar yechsangiz, tez natija ko'rasiz.</div>
    </div>
    <button class="btn" onclick="openAnalysis()">✨ To'liq shaxsiy tahlilni olish</button>
    <button class="btn ghost" onclick="start()">Qayta topshirish</button>
    <div class="small">Bu o'yin-test bo'lib, rasmiy klinik IQ testi o'rnini bosmaydi. Ball taxminiy.</div>
  </div>`;
  if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function openAnalysis(){
  if(tg && tg.openTelegramLink) tg.openTelegramLink(ANALYSIS_LINK); else window.open(ANALYSIS_LINK,'_blank');
}

start();
</script>
