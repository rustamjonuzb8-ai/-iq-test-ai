<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>IQ TEST AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg1:#1a0b2e;--bg2:#2d1458;--p:#8b5cf6;--p3:#c4b5fd;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--ok:#34d399;--soft:#a78bfa;--txt:#f5f3ff;--mut:#b9aee0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 20% 0%,#4c1d95 0%,transparent 45%),linear-gradient(160deg,var(--bg2),var(--bg1));background-attachment:fixed;min-height:100vh;color:var(--txt);padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 28px)}
.wrap{max-width:480px;margin:0 auto;padding-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.3);margin-bottom:14px}
.hidden{display:none!important}
.center{text-align:center}
.logo{font-size:56px;width:96px;height:96px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;border-radius:28px;background:linear-gradient(135deg,var(--p),#6d28d9);box-shadow:0 10px 30px rgba(139,92,246,.5)}
h1{font-size:30px;letter-spacing:1px;margin-bottom:8px}
h2{font-size:20px;line-height:1.45;margin-bottom:16px}
h3{font-size:18px;margin-bottom:12px}
.sub{color:var(--mut);margin-bottom:18px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.chips span{background:rgba(139,92,246,.2);border:1px solid rgba(167,139,250,.35);padding:8px 12px;border-radius:99px;font-size:13px}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 8px 24px rgba(109,40,217,.45);cursor:pointer;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none}
.note{margin-top:14px;font-size:12px;color:var(--mut);line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;gap:8px}
.tag{font-size:13px;background:rgba(139,92,246,.2);padding:6px 12px;border-radius:99px}
.timer{background:rgba(139,92,246,.25);padding:6px 14px;border-radius:99px;min-width:56px;text-align:center}
.timer.low{background:rgba(251,191,36,.25);color:#fde68a}
.bar,.tbar{height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.bar{margin-bottom:14px}
.tbar{margin-bottom:18px}
#pbar,#tbar{height:100%;background:linear-gradient(90deg,var(--p),var(--p3));border-radius:9px;transition:width .4s}
#tbar{transition:width 1s linear}
.dots{letter-spacing:3px;color:var(--p3);font-size:12px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:16px;line-height:1.4;cursor:pointer;transition:.2s}
.opt:active{transform:scale(.98)}
.opt.ok{background:rgba(52,211,153,.18);border-color:var(--ok)}
.opt.soft{background:rgba(167,139,250,.18);border-color:var(--soft)}
.opt[disabled]{pointer-events:none}
.fb{margin-top:6px;padding:14px;border-radius:14px;background:rgba(139,92,246,.15);border:1px solid rgba(167,139,250,.3);line-height:1.5;font-size:14px}
.fb b{display:block;margin-bottom:4px;font-size:15px}
.emoji{font-size:48px;margin-bottom:6px}
.score{font-size:64px;font-weight:800;background:linear-gradient(135deg,#fff,var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
.score span{font-size:28px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:rgba(139,92,246,.18);border-radius:16px;padding:12px 4px}
.stats b{display:block;font-size:20px}
.stats small{color:var(--mut);font-size:12px}
.cat{margin-bottom:14px}
.cat .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.cat .b{height:10px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.cat .b i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p3));border-radius:9px}
.tips{list-style:none}
.tips li{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.5;font-size:15px}
.tips li:last-child{border:0}
.lock{opacity:.6}
.lock li::before{content:"🔒 "}
.free{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);border-radius:14px;padding:14px;line-height:1.5;margin-bottom:12px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">

<div id="start" class="card center">
  <div class="logo">🧠</div>
  <h1>IQ TEST AI</h1>
  <p class="sub" id="hello">Mantiq, falsafa va psixologiya uyg'unlashgan fikrlash testi</p>
  <div class="chips"><span>20 ta savol</span><span>5 daraja</span><span>108 ta savol bazasi</span><span>Har safar yangi savollar</span><span>📊 Shaxsiy xulosa</span></div>
  <p class="sub" id="best"></p>
  <button class="btn" onclick="startQuiz()">Testni boshlash</button>
  <p class="note">Bu fikrlash qobiliyatini sinash uchun test. Rasmiy IQ o'lchovi yoki psixologik tashxis emas.</p>
</div>

<div id="quiz" class="hidden">
  <div class="top"><span id="count">1/20</span><span id="streak" class="tag hidden"></span><span id="timer" class="timer">40</span></div>
  <div class="bar"><div id="pbar"></div></div>
  <div class="card">
    <div class="tbar"><div id="tbar"></div></div>
    <div class="dots" id="meta"></div>
    <h2 id="qtext"></h2>
    <div id="opts"></div>
    <div id="fb" class="fb hidden"></div>
    <button id="next" class="btn hidden" onclick="nextQ()">Keyingisi →</button>
  </div>
</div>

<div id="result" class="hidden"></div>

</div>

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function getSeen() {
  try { return JSON.parse(load("iq_seen2") || "[]"); } catch (e) { return []; }
}

function buildQuiz() {
  const seen = getSeen();
  const used = [];
  const chosen = [];
  const catKeys = Object.keys(CATS);
  for (let d = 1; d <= 5; d++) {
    const pool = BANK.filter(q => q.d === d);
    const key = q => (seen.indexOf(q.id) >= 0 ? 2 : 0) + Math.random();
    const cats = shuffle(catKeys).slice(0, 4);
    const picked = [];
    cats.forEach(c => {
      const list = pool.filter(q => q.c === c).sort((a, b) => key(a) - key(b));
      if (list.length) picked.push(list[0]);
    });
    shuffle(picked).forEach(q => { chosen.push(q); used.push(q.id); });
  }
  let newSeen = seen.concat(used);
  if (newSeen.length > 90) newSeen = used;
  save("iq_seen2", JSON.stringify(newSeen));
  return chosen.map(q => {
    const opts = shuffle(q.o.map((t, i) => ({t:t, ok:i === 0})));
    return {c:q.c, d:q.d, q:q.q, x:q.x, o:opts.map(z => z.t), a:opts.findIndex(z => z.ok), t:TIMES[q.d]};
  });
}

let Q = [];

let stat = {};
const $ = id => document.getElementById(id);

(function () {
  const b = load("iq_best");
  if (b) $("best").textContent = "Eng yaxshi natijangiz: " + b + "/20";
})();

function show(id) {
  ["start", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

function startQuiz() {
  Q = buildQuiz();
  i = 0; score = 0; streak = 0; maxStreak = 0; ans = []; t0 = Date.now();
  stat = {R:[0,0], M:[0,0], S:[0,0], F:[0,0], P:[0,0]};
  show("quiz");
  render();
}

function setTimer() {
  const t = $("timer");
  t.textContent = left;
  t.classList.toggle("low", left <= 8);
  $("tbar").style.width = (left / curLimit * 100) + "%";
}

function render() {
  locked = false;
  const q = Q[i];
  curLimit = q.t;
  left = curLimit;
  $("count").textContent = (i + 1) + "/" + Q.length;
  $("pbar").style.width = (i / Q.length * 100) + "%";
  $("meta").textContent = CATS[q.c].e + " " + CATS[q.c].n + "   " + "●".repeat(q.d) + "○".repeat(5 - q.d);
  $("qtext").textContent = q.q;
  $("fb").classList.add("hidden");
  $("next").classList.add("hidden");
  const st = $("streak");
  if (streak >= 2) { st.textContent = "🔥 " + streak; st.classList.remove("hidden"); } else st.classList.add("hidden");
  const box = $("opts");
  box.innerHTML = "";
  q.o.forEach((t, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = t;
    b.onclick = () => pick(k);
    box.appendChild(b);
  });
  setTimer();
  clearInterval(timer);
  timer = setInterval(() => {
    left--;
    setTimer();
    if (left <= 0) pick(-1);
  }, 1000);
}

function cheer() {
  if (i === 4) return " Zo'r boshlanish!";
  if (i === 9) return " Yarmi o'tdi, davom eting!";
  if (i === 14) return " Oxirgi 5 ta savol qoldi!";
  return "";
}

function pick(k) {
  if (locked) return;
  locked = true;
  clearInterval(timer);
  const q = Q[i];
  ans.push(k);
  stat[q.c][1]++;
  const btns = $("opts").children;
  for (const b of btns) b.setAttribute("disabled", "");
  let title;
  if (k === q.a) {
    score++; stat[q.c][0]++; streak++; if (streak > maxStreak) maxStreak = streak;
    title = streak >= 3 ? "🔥 To'g'ri! " + streak + " ta ketma-ket" : "✅ To'g'ri!";
    haptic("success");
  } else {
    streak = 0;
    if (k >= 0) btns[k].classList.add("soft");
    title = k === -1 ? "⏱ Vaqt tugadi. Hech qisi yo'q!" : "💜 Yaxshi urinish!";
    haptic("warning");
  }
  btns[q.a].classList.add("ok");
  $("fb").innerHTML = "<b>" + title + cheer() + "</b>" + q.x;
  $("fb").classList.remove("hidden");
  const nx = $("next");
  nx.textContent = i === Q.length - 1 ? "Natijani ko'rish →" : "Keyingisi →";
  nx.classList.remove("hidden");
}

function nextQ() {
  i++;
  if (i < Q.length) render(); else finish();
}

function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function finish() {
  clearInterval(timer);
  const sec = Math.round((Date.now() - t0) / 1000);
  const pct = Math.round(score / Q.length * 100);
  const lvl = LEVELS.find(l => score <= l.max);
  const prev = parseInt(load("iq_best") || "0", 10);
  if (score > prev) save("iq_best", String(score));

  const keys = Object.keys(CATS).filter(c => stat[c][1] > 0);
  const rate = c => stat[c][0] / stat[c][1];
  const sorted = keys.slice().sort((a, b) => rate(b) - rate(a));
  const best = sorted[0], weak = sorted[sorted.length - 1];

  const bars = keys.map(c => {
    const p = Math.round(rate(c) * 100);
    return '<div class="cat"><div class="r"><span>' + CATS[c].e + ' ' + CATS[c].n + '</span><b>' + stat[c][0] + '/' + stat[c][1] + '</b></div><div class="b"><i style="width:' + p + '%"></i></div></div>';
  }).join("");

  const record = score > prev && prev > 0 ? '<p class="sub" style="margin-top:12px">🎉 Yangi shaxsiy rekord!</p>' : "";

  $("result").innerHTML =
    '<div class="card center">' +
      '<div class="emoji">' + lvl.e + '</div>' +
      '<div class="score">' + score + '<span>/' + Q.length + '</span></div>' +
      '<p class="sub"><b>' + lvl.t + '</b><br>' + lvl.s + '</p>' +
      '<div class="stats">' +
        '<div><b>' + pct + '%</b><small>To\'g\'ri</small></div>' +
        '<div><b>🔥 ' + maxStreak + '</b><small>Eng uzun seriya</small></div>' +
        '<div><b>' + fmt(sec) + '</b><small>Vaqt</small></div>' +
      '</div>' + record +
    '</div>' +
    '<div class="card"><h3>📊 Yo\'nalishlar bo\'yicha</h3>' + bars + '</div>' +
    '<div class="card"><h3>💡 Sizga tavsiya</h3>' +
      '<div class="free"><b>Eng kuchli tomoningiz:</b> ' + CATS[best].e + ' ' + CATS[best].n + '.<br>O\'sish uchun: ' + CATS[weak].e + ' ' + CATS[weak].n + ' ustida ishlang. ' + TIP[weak] + '</div>' +
    '</div>' +
    '<div class="card"><h3>🔓 Shaxsiy tahlil</h3>' +
      '<p class="sub">Bepul xulosa tepada. To\'liq tahlilda quyidagilar bo\'ladi:</p>' +

}

function finish() {
  clearInterval(timer);
  const sec = Math.round((Date.now() - t0) / 1000);
  const pct = Math.round(score / Q.length * 100);
  const lvl = LEVELS.find(l => score <= l.max);
  const prev = parseInt(load("iq_best") || "0", 10);
  if (score > prev) save("iq_best", String(score));

  const COL = {R:"#22d3ee", M:"#a78bfa", S:"#fbbf24", F:"#f472b6", P:"#34d399"};
  const keys = Object.keys(CATS).filter(c => stat[c][1] > 0);
  const rate = c => stat[c][0] / stat[c][1];
  const sorted = keys.slice().sort((a, b) => rate(b) - rate(a));
  const best = sorted[0], weak = sorted[sorted.length - 1];

  const bars = keys.map(c => {
    const p = Math.round(rate(c) * 100);
    return '<div class="cat"><div class="r"><span>' + CATS[c].e + ' ' + CATS[c].n + '</span><b>' + stat[c][0] + '/' + stat[c][1] + '</b></div><div class="b"><i style="width:' + p + '%;background:' + COL[c] + '"></i></div></div>';
  }).join("");

  let wrongHtml = "", wrongCount = 0;
  Q.forEach((q, n) => {
    if (ans[n] !== q.a) {
      wrongCount++;
      const mine = ans[n] === -1 ? "Vaqt tugadi" : q.o[ans[n]];
      wrongHtml += '<div class="rw"><b>' + (n + 1) + '. ' + q.q + '</b><br><span class="a">Sizning javobingiz: ' + mine + '</span><br><span class="c">To\'g\'ri javob: ' + q.o[q.a] + '</span><br>' + q.x + '</div>';
    }
  });
  const review = wrongCount
    ? '<details class="rdet"><summary>🔍 Xatolar tahlili (' + wrongCount + ')</summary>' + wrongHtml + '</details>'
    : '<div class="rok">🎉 Xatosiz! Barcha javoblaringiz to\'g\'ri.</div>';

  const record = score > prev && prev > 0 ? ' · 🎉 Yangi rekord!' : '';

  $("result").innerHTML =
    '<div class="rhero">' +
      '<div class="rring">' +
        '<svg width="150" height="150" viewBox="0 0 120 120">' +
          '<circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/>' +
          '<circle id="rarc" cx="60" cy="60" r="52" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" style="transition:stroke-dashoffset 1.2s ease"/>' +
        '</svg>' +
        '<div class="n"><b>' + score + '</b><span>/ ' + Q.length + '</span></div>' +
      '</div>' +
      '<div class="rlvl">' + lvl.e + ' ' + lvl.t + '</div>' +
      '<div class="rsub">' + lvl.s + record + '</div>' +
      '<div class="rstats">' +
        '<div><b>' + pct + '%</b><small>To\'g\'ri</small></div>' +
        '<div><b>🔥 ' + maxStreak + '</b><small>Eng uzun seriya</small></div>' +
        '<div><b>' + fmt(sec) + '</b><small>Vaqt</small></div>' +
      '</div>' +
    '</div>' +

    '<div class="card"><h3>📊 Yo\'nalishlar</h3>' + bars +
      '<div class="rpills">' +
        '<div class="rpill g"><b>💪 Kuchli tomon</b>' + CATS[best].e + ' ' + CATS[best].n + '</div>' +
        '<div class="rpill o"><b>🎯 O\'sish uchun</b>' + CATS[weak].e + ' ' + CATS[weak].n + '</div>' +
      '</div>' +
      '<p class="rtip">💡 ' + TIP[weak] + '</p>' +
    '</div>' +

    review +

    '<div class="rpro">' +
      '<h3>✨ Shaxsiy tahlil</h3>' +
      '<ul>' +
        '<li>🧠 Fikrlash uslubingiz: tezmi yoki puxtami</li>' +
        '<li>🔎 Har bir xatongizning sababi va yechimi</li>' +
        '<li>📅 7 kunlik shaxsiy mashq rejasi</li>' +
      '</ul>' +
      '<button class="rb main" style="margin-top:10px" onclick="wantPro()">✨ Shaxsiy tahlilni olish</button>' +
    '</div>' +

    '<div class="rgrid">' +
      '<button class="rb g1" onclick="startQuiz()">🔄 Qayta topshirish</button>' +
      '<button class="rb g2" onclick="shareRes()">📤 Ulashish</button>' +
      '<button class="rb g3" onclick="contactAdmin()">💬 Admin</button>' +
      '<button class="rb g4" onclick="closeApp()">✖️ Yopish</button>' +
    '</div>' +
    '<p class="note center">Natija taxminiy. Rasmiy IQ o\'lchovi yoki psixologik tashxis emas.</p>';

  show("result");
  setTimeout(() => {
    const a = $("rarc");
    if (a) a.style.strokeDashoffset = String(327 * (1 - score / Q.length));
  }, 80);
  haptic("success");
}

}
